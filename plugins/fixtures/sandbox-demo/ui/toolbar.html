<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { margin: 0; font: 12px system-ui; color: var(--foreground); background: transparent; }
      button { border: 1px solid var(--border); border-radius: 8px; height: 26px; padding: 0 9px; background: var(--surface-raised); color: var(--foreground); font: inherit; cursor: pointer; }
      button:hover { background: var(--surface-hover); }
    </style>
  </head>
  <body>
    <button id="open">Open notes</button>
    <script src="/@zylara/sdk.js"></script>
    <script>
      document.getElementById('open').addEventListener('click', () => {
        ZylaraPlugin.rpc('notify', { title: 'Acme Notes', body: 'Open Acme Notes from the sidebar.' });
      });
    </script>
  </body>
</html>
