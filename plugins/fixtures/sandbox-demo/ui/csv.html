<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { margin: 0; padding: 12px; font: 12px/1.5 var(--font-mono, monospace); color: var(--foreground); }
      pre { white-space: pre-wrap; margin: 0; }
    </style>
  </head>
  <body>
    <pre id="content"></pre>
    <script src="/@zylara/sdk.js"></script>
    <script>
      function render() {
        const content = ZylaraPlugin.context.content || '';
        document.getElementById('content').textContent = content;
        ZylaraPlugin.resize();
      }
      ZylaraPlugin.on('init', render);
      ZylaraPlugin.on('theme', render);
    </script>
  </body>
</html>
