[package]
name = "zylara"
version = "0.11.1"
description = "Zylara — desktop AI chat harness (OpenCode Go / Zen / OpenAI ChatGPT plan)"
authors = ["Zylara"]
edition = "2021"
# Necessário pelo harness de código: `notify` (watch) exige 1.85 e `ignore`/crates
# de busca exigem 1.88; o toolchain do projeto é 1.99 (docs/goals/code-harness/PLAN.md §10).
rust-version = "1.89"

[lib]
name = "zylara_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
# Leitura direta do clipboard no backend (arquivos CF_HDROP + imagens) para o
# Ctrl+V do composer; o plugin acima já traz a mesma versão na árvore.
arboard = "3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
getrandom = "0.2"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "stream",
  "blocking",
  "gzip",
  "brotli",
] }

rusqlite = { version = "0.40", features = ["bundled"] }

anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

scraper = "0.29"
regex = "1"
zip = "9"
quick-xml = "0.42"
calamine = "0.37"
pdf-extract = "0.12"
# Prévia de imagens: converte formatos que o WebView não abre (TIFF) para PNG e
# lê dimensões. `png`/`tiff` já estão na árvore transitiva (arboard); os demais
# decodificadores entram para a miniatura dos cards da Biblioteca
# (`get_artifact_thumbnail`, docs/goals/library-page/PLAN.md §2.3).
image = { version = "0.25", default-features = false, features = [
  "png",
  "tiff",
  "jpeg",
  "gif",
  "webp",
  "bmp",
  "ico",
] }
encoding_rs = "0.8"
chardetng = "1"
infer = "0.22"
base64 = "0.23"
sha2 = "0.11"
mime_guess = "2"
include_dir = "0.7"
url = "2"
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = "0.27"
async-trait = "0.1"
parking_lot = "0.13"
once_cell = "1"
percent-encoding = "2"

# --- Harness de código (docs/goals/code-harness/) -------------------------
# Diff de linhas para o painel Alterações / journal (similar 2.7 está no cache).
similar = "2"
# Diretórios temporários nos testes das tools de FS/git e no journal.
tempfile = "3"
# Caminhos canônicos no Windows (remove prefixo `\\?\` sem perder a canonicalização).
dunce = "1"
# Terminal PTY do layout Code (ConPTY no Windows).
portable-pty = "0.8"
# Árvore/busca do workspace respeitando .gitignore (mesmo motor do ripgrep).
ignore = "0.4"
globset = "0.4"
# Recursive filesystem watcher for the Code panel (RDCW/FSEvents/inotify).
notify = "8"

[profile.dev]
incremental = true
[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(unix)'.dependencies]
# Polls the parent process in the managed-update helper.
libc = "0.2"

# Windows: Job Object do runner de processos (kill de árvore confiável no
# cancelamento/timeout; docs/research/workspace-runtime-options.md §3.4).
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
